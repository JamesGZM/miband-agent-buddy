<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>MiBand Agent Buddy</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div id="app">
      <aside>
        <div class="brand">
          <span class="brand-mark">⌘</span
          ><strong>MiBand<br />Agent Buddy</strong>
        </div>
        <nav id="navigation"></nav>
        <div class="sidebar-bottom">
          <div id="device-summary"></div>
          <button class="nav settings" data-page="settings">
            <span>⚙</span>應用設定
          </button>
          <div class="edition">OPEN SOURCE <span>AGPL-3.0</span></div>
        </div>
      </aside>
      <main>
        <header>
          <div>
            <h1 id="title">Buddy</h1>
            <p id="subtitle">讓手環成為你的桌面伙伴</p>
          </div>
          <div id="connection"></div>
        </header>
        <div id="notice" role="status" aria-live="polite"></div>
        <div id="content"></div>
        <footer>
          <span>MiBand Agent Buddy <b>0.5.0</b></span
          ><span id="last-sync">尚未同步</span>
        </footer>
      </main>
    </div>
    <script src="app.js" type="module"></script>
  </body>
</html>
