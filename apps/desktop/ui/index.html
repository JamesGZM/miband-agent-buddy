<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>MiBand Agent Buddy</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div id="app">
      <aside>
        <div class="titlebar" data-tauri-drag-region></div>
        <div class="brand" data-tauri-drag-region>
          <img class="brand-icon" src="assets/app-icon.png" alt="" />
          <div class="brand-text"><span class="brand-name">MiBand</span><span class="brand-sub">Agent Buddy</span></div>
        </div>
        <nav id="navigation"></nav>
        <div class="sidebar-bottom">
          <div id="device-summary"></div>
        </div>
      </aside>
      <main>
        <header data-tauri-drag-region>
          <h1 id="title" data-tauri-drag-region>Buddy</h1>
        </header>
        <div id="notice" role="status" aria-live="polite"></div>
        <div id="content"></div>
        <div id="toast" class="toast" role="status" aria-live="assertive"></div>
      </main>
    </div>
    <script src="app.js" type="module"></script>
  </body>
</html>
