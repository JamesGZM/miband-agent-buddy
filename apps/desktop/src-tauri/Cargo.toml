[package]
name = "miband-agent-buddy"
version = "0.7.3"
edition = "2024"
publish = false

[features]
custom-protocol = ["tauri/custom-protocol"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2.11.3", features = ["tray-icon", "image-png"] }
tokio = { version = "1", features = ["process", "time", "io-util"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "cookies", "rustls-tls"] }
reqwest_cookie_store = "0.8"
base64 = "0.22"
cipher = "0.4"
crc = "3"
rand = "0.8"
sha1 = "0.10"
sha2 = "0.10"
url = "2"
md-5 = "0.10"
rc4 = "0.1"
aes = "0.8"
cbc = { version = "0.1", features = ["alloc"] }
log = "0.4"
zip = { version = "0.6.6", default-features = false, features = ["deflate"] }

tauri-plugin-autostart = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-notification = "2"

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security_Cryptography", "Win32_Storage_FileSystem", "Win32_Globalization", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }
