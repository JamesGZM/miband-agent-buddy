name: Source checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@stable
      - run: python -m pip install -r requirements.txt
      - run: npm ci --prefix quickapp
      - run: npm run bootstrap
      - run: npm run build
      - run: npm test
      - run: cargo test --locked --manifest-path native/transport/Cargo.toml
      - run: cargo test --locked --manifest-path desktop/src-tauri/Cargo.toml
      - run: npm run build:desktop
