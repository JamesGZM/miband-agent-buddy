[package]
name = "buddy-transport"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
anyhow = "1"
bluest = "=0.6.9"
corelib = { path = "upstream/core", default-features = false }
futures-util = "0.3"
serde_json = "1"
pb = { path = "upstream/pb" }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time", "io-util", "io-std", "sync"] }
uuid = { version = "1", features = ["v4"] }

[target.'cfg(target_os = "macos")'.dependencies]
dispatch = "0.2"
objc2-io-bluetooth = "0.3.2"
objc2 = "0.6.3"
objc2-io-kit = "0.3"
objc2-foundation = "0.3.2"
objc2-core-foundation = "0.3.2"
once_cell = "1"
log = "0.4"
serde = { version = "1", features = ["derive"] }
